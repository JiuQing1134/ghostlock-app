# Route note: the pselect fd_set window is infeasible on this build (the
# futex_wait_requeue_pi waiter is 12 qwords above the fd_set buffer), and the
# 6.12 TCP/multicast copy windows are too deep. compact_waiter = 3 selects the
# 6.12 rt_sigreturn/fpsimd_context carrier in select_stack_route.cpp:
#   __arm64_sys_rt_sigreturn total frame 0x510
#   read_fpsimd_context copies 0x200 B to sp+0x290
#   -> vregs start depth 0x280
#   futex_wait_requeue_pi waiter base depth 0x1a0
#   -> carrier word 28 = waiter tree.parent
#      carrier word 38 = waiter task (0x50)
#      carrier word 39 = waiter lock (0x58)
# The handler patches fpsimd vregs[14..20] before returning; rt_sigreturn
# then places the neutral stack waiter on the waiter's kernel stack. The
# actual rb_erase write arm remains in heap.current.fake_w0's pi_tree.
# The old vmsplice mode 2 profile is kept at build/6.12.23-aap-vmsplice2.conf.bak.
